<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoo Code Academy</title>
<style>
:root {
  --bg: #f8f9fa;
  --bg-card: #ffffff;
  --bg-sidebar: #1a1a2e;
  --bg-code: #1e1e2e;
  --text: #2d3436;
  --text-light: #636e72;
  --text-code: #cdd6f4;
  --accent: #714baf;
  --accent-light: #e8def8;
  --accent-dark: #5a3d8a;
  --success: #00b894;
  --success-light: #d4f5ed;
  --error: #d63031;
  --error-light: #fde8e8;
  --warning: #fdcb6e;
  --border: #dfe6e9;
  --sidebar-text: #b2bec3;
  --sidebar-active: #ffffff;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 24px rgba(0,0,0,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
#app { display: flex; min-height: 100vh; }
#sidebar { width: 280px; min-width: 280px; background: var(--bg-sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s ease; overflow-y: auto; }
#sidebar.collapsed { transform: translateX(-280px); }
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-header h1 { font-size: 20px; color: #fff; font-weight: 700; }
.subtitle { font-size: 12px; color: var(--sidebar-text); margin-top: 2px; }
.progress-bar-container { background: rgba(255,255,255,0.1); border-radius: 4px; height: 6px; margin-top: 16px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 4px; width: 0%; transition: width 0.5s ease; }
.progress-text { font-size: 11px; margin-top: 4px; display: block; }
.module-list { padding: 12px 0; flex: 1; }
.module-group { margin-bottom: 4px; }
.module-header { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sidebar-text); transition: color 0.2s; user-select: none; }
.module-header:hover { color: #fff; }
.module-header .arrow { font-size: 10px; transition: transform 0.2s; flex-shrink: 0; }
.module-header.expanded .arrow { transform: rotate(90deg); }
.module-header .mod-icon { flex-shrink: 0; }
.module-header .mod-progress { margin-left: auto; font-size: 11px; font-weight: 400; opacity: 0.7; }
.lesson-list { display: none; padding: 2px 0 8px; }
.lesson-list.open { display: block; }
.lesson-item { display: flex; align-items: center; gap: 8px; padding: 6px 20px 6px 40px; font-size: 13px; cursor: pointer; color: var(--sidebar-text); transition: all 0.2s; border-left: 2px solid transparent; }
.lesson-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
.lesson-item.active { color: #fff; background: rgba(113,75,175,0.2); border-left-color: var(--accent); }
.lesson-item.completed .check { color: var(--success); }
.lesson-item .check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--sidebar-text); font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.lesson-item.completed .check { border-color: var(--success); background: var(--success); color: #fff; }
.sidebar-toggle { position: fixed; top: 12px; left: 12px; z-index: 101; background: var(--bg-sidebar); color: #fff; border: none; border-radius: 6px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: var(--shadow); }
main { flex: 1; margin-left: 280px; min-width: 0; }
.view { display: none; padding: 40px; max-width: 860px; margin: 0 auto; }
.view.active { display: block; }
.hero { text-align: center; padding: 60px 20px; }
.hero h2 { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
.hero p { font-size: 17px; color: var(--text-light); max-width: 520px; margin: 0 auto 32px; }
.hero-stats { display: flex; justify-content: center; gap: 48px; margin-bottom: 32px; }
.stat { text-align: center; }
.stat-num { display: block; font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 13px; color: var(--text-light); }
.roadmap { margin-top: 20px; }
.roadmap h3 { font-size: 20px; margin-bottom: 20px; }
.roadmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.roadmap-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all 0.2s; }
.roadmap-card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.roadmap-card .mod-num { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
.roadmap-card h4 { font-size: 15px; margin: 6px 0 8px; font-weight: 600; }
.roadmap-card p { font-size: 13px; color: var(--text-light); line-height: 1.5; }
.roadmap-card .card-progress { margin-top: 12px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.roadmap-card .card-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost { background: none; color: var(--text-light); padding: 8px 12px; }
.btn-ghost:hover { color: var(--accent); }
.lesson-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.lesson-breadcrumb { font-size: 13px; color: var(--text-light); }
.lesson-body h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.lesson-body h3 { font-size: 19px; font-weight: 600; margin: 32px 0 12px; padding-top: 8px; }
.lesson-body h4 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.lesson-body p { margin-bottom: 14px; font-size: 15px; line-height: 1.7; }
.lesson-body ul, .lesson-body ol { margin: 0 0 14px 24px; font-size: 15px; line-height: 1.7; }
.lesson-body li { margin-bottom: 4px; }
.code-block { background: var(--bg-code); border-radius: var(--radius); margin: 16px 0; overflow: hidden; }
.code-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: rgba(0,0,0,0.2); font-size: 12px; color: #888; }
.code-header .lang { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.code-content { padding: 16px; overflow-x: auto; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13.5px; line-height: 1.65; color: var(--text-code); }
.code-content .line { display: block; min-height: 1.65em; }
.code-content .line-num { display: inline-block; width: 32px; color: #555; text-align: right; margin-right: 16px; user-select: none; }
.kw { color: #cba6f7; } .str { color: #a6e3a1; } .num { color: #fab387; } .cm { color: #6c7086; font-style: italic; } .fn { color: #89b4fa; } .dec { color: #f9e2af; } .cls { color: #89dceb; } .op { color: #94e2d5; } .tag { color: #cba6f7; } .attr { color: #89b4fa; } .val { color: #a6e3a1; } .xml-cm { color: #6c7086; font-style: italic; }
.code-annotation { background: rgba(113,75,175,0.1); border-left: 3px solid var(--accent); padding: 10px 14px; margin: 12px 0; border-radius: 0 var(--radius) var(--radius) 0; font-size: 13.5px; line-height: 1.6; }
.code-annotation strong { color: var(--accent); }
.lesson-body code { background: rgba(113,75,175,0.1); color: var(--accent-dark); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.9em; }
.callout { border-radius: var(--radius); padding: 16px 20px; margin: 20px 0; font-size: 14px; line-height: 1.6; }
.callout-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px; }
.callout-tip { background: #e8f8f5; border-left: 4px solid var(--success); }
.callout-tip .callout-title { color: var(--success); }
.callout-warning { background: #fef9e7; border-left: 4px solid #f39c12; }
.callout-warning .callout-title { color: #e67e22; }
.callout-info { background: var(--accent-light); border-left: 4px solid var(--accent); }
.callout-info .callout-title { color: var(--accent); }
.callout-support { background: #e3f2fd; border-left: 4px solid #2196f3; }
.callout-support .callout-title { color: #1565c0; }
.compare-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.compare-table th { background: var(--bg); padding: 10px 14px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
.compare-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.compare-table tr:hover td { background: rgba(113,75,175,0.03); }
.quiz-section { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 24px; margin: 32px 0; }
.quiz-section h3 { margin: 0 0 16px; padding: 0; font-size: 17px; color: var(--accent); }
.quiz-question { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.quiz-question:last-of-type { border-bottom: none; margin-bottom: 12px; padding-bottom: 0; }
.quiz-question p { font-weight: 600; margin-bottom: 10px; }
.quiz-options { list-style: none; margin: 0; padding: 0; }
.quiz-options li { padding: 10px 14px; margin: 4px 0; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.quiz-options li:hover { border-color: var(--accent); background: var(--accent-light); }
.quiz-options li.correct { border-color: var(--success); background: var(--success-light); }
.quiz-options li.wrong { border-color: var(--error); background: var(--error-light); }
.quiz-options li.disabled { pointer-events: none; }
.quiz-explanation { display: none; margin-top: 10px; padding: 10px 14px; background: var(--bg); border-radius: 6px; font-size: 13px; line-height: 1.5; }
.quiz-explanation.visible { display: block; }
.complete-section { text-align: center; padding: 32px 0 16px; border-top: 1px solid var(--border); margin-top: 32px; }
.btn-complete { background: var(--success); color: #fff; padding: 12px 32px; font-size: 15px; }
.btn-complete:hover { background: #00a884; }
.btn-complete.done { background: var(--bg); color: var(--success); border: 2px solid var(--success); cursor: default; }
.lesson-footer { display: flex; justify-content: space-between; padding-top: 24px; margin-top: 16px; }
.toggle-block { border: 1px solid var(--border); border-radius: var(--radius); margin: 16px 0; overflow: hidden; }
.toggle-header { padding: 12px 16px; background: var(--bg); cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; user-select: none; }
.toggle-header:hover { background: var(--accent-light); }
.toggle-header .arrow { transition: transform 0.2s; font-size: 11px; }
.toggle-header.open .arrow { transform: rotate(90deg); }
.toggle-content { display: none; padding: 16px; border-top: 1px solid var(--border); }
.toggle-content.open { display: block; }
@media (max-width: 900px) {
  #sidebar { transform: translateX(-280px); }
  #sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  main { margin-left: 0; }
  .view { padding: 24px 16px; }
  .hero { padding: 40px 12px; }
  .hero h2 { font-size: 24px; }
  .hero-stats { gap: 24px; }
  .roadmap-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-header">
      <h1>Odoo Academy</h1>
      <p class="subtitle">Read Odoo Code Like a Pro</p>
      <div class="progress-bar-container"><div class="progress-bar" id="globalProgress"></div></div>
      <span class="progress-text" id="globalProgressText">0% complete</span>
    </div>
    <div id="moduleList" class="module-list"></div>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">&#9776;</button>
  </nav>
  <main id="content">
    <div id="homeView" class="view active">
      <div class="hero">
        <h2>Welcome to Odoo Code Academy</h2>
        <p>A step-by-step course to help you <strong>read and understand Odoo source code</strong> — no programming experience needed. Built for support analysts.</p>
        <div class="hero-stats">
          <div class="stat"><span class="stat-num">7</span><span class="stat-label">Modules</span></div>
          <div class="stat"><span class="stat-num">21</span><span class="stat-label">Lessons</span></div>
          <div class="stat"><span class="stat-num">60+</span><span class="stat-label">Examples</span></div>
        </div>
        <button class="btn btn-primary" id="startBtn">Start Learning</button>
        <button class="btn btn-secondary" id="continueBtn" style="display:none">Continue Where You Left Off</button>
      </div>
      <div class="roadmap"><h3>Your Learning Path</h3><div class="roadmap-grid" id="roadmapGrid"></div></div>
    </div>
    <div id="lessonView" class="view">
      <div class="lesson-header">
        <button class="btn btn-ghost" id="backBtn">&larr; Back</button>
        <span class="lesson-breadcrumb" id="lessonBreadcrumb"></span>
      </div>
      <div class="lesson-body" id="lessonBody"></div>
      <div class="lesson-footer">
        <button class="btn btn-secondary" id="prevLessonBtn">&larr; Previous</button>
        <button class="btn btn-primary" id="nextLessonBtn">Next &rarr;</button>
      </div>
    </div>
  </main>
</div>
<script>
const MODULES = [
  {
    id: 'm1', icon: '\u{1F4D6}',
    title: 'Reading Python',
    desc: 'Learn to read Python code from zero — no programming experience needed.',
    lessons: [
      { id: 'm1l1', title: 'What Does Python Look Like?', content: () => `
<h2>What Does Python Look Like?</h2>
<p>Python is the language that Odoo is built with. You don't need to write Python — but you DO need to <strong>read</strong> it when investigating issues. Let's start from absolute zero.</p>

<h3>Storing Information: Variables</h3>
<p>In Python, you store information by giving it a name. Think of it like labeling a box:</p>

${CB('python', `name = "Sales Order"
count = 42
price = 19.99
is_active = True`)}

${AN('Each line stores a piece of information:<br><strong>Line 1:</strong> Store the text "Sales Order" and call it <code>name</code><br><strong>Line 2:</strong> Store the number 42 and call it <code>count</code><br><strong>Line 3:</strong> Store the number 19.99 and call it <code>price</code><br><strong>Line 4:</strong> Store True (yes/on) and call it <code>is_active</code>')}

${CO('info', 'Think of it like...', 'A variable is like a cell in a spreadsheet. The name is the column header, and the value is what\'s in the cell.')}

<h3>Types of Information</h3>
<p>Python has different types of information, just like a spreadsheet has text, numbers, and checkboxes:</p>

${CT([
  ['Type', 'What it looks like', 'Example in Odoo'],
  ['Text (string)', '<code>"Hello"</code> or <code>\'Hello\'</code> (with quotes)', 'Product name, customer email'],
  ['Whole number (integer)', '<code>42</code> (no quotes)', 'Quantity, sequence number'],
  ['Decimal number (float)', '<code>19.99</code>', 'Price, tax amount'],
  ['Yes/No (boolean)', '<code>True</code> or <code>False</code>', 'Is active? Is paid?'],
  ['Nothing (empty)', '<code>None</code> or <code>False</code>', 'Empty field, no customer selected'],
])}

${CO('warning', 'Important!', '<code>True</code> and <code>False</code> are always capitalized in Python. Writing <code>true</code> (lowercase) would cause an error. And "nothing" is written as <code>None</code> (also capitalized).')}

<h3>Text in Quotes</h3>
<p>Whenever you see something in quotes (<code>"..."</code> or <code>'...'</code>), it's text. Without quotes, Python treats it as a variable name or number:</p>

${CB('python', `state = "draft"           # "draft" is text (a value)
state = draft             # This would be an ERROR - Python looks for
                          # a variable called draft, which doesn't exist`)}

${AN('<strong>Rule:</strong> Text always needs quotes. Numbers never need quotes. Variable names never have quotes.')}

<h3>Comments: Lines That Do Nothing</h3>
<p>Lines starting with <code>#</code> are <strong>comments</strong> — notes for humans. Python ignores them completely:</p>

${CB('python', `# This is a comment - Python skips this line
name = "Sales Order"    # This part after # is also ignored
# price = 100           # This code is "commented out" - it won't run`)}

${CO('tip', 'Why this matters', 'When reading Odoo code, comments explain what the developer was thinking. They\'re like sticky notes in the code.')}

${QZ([
  { q: 'In Python, how do you write "yes" or "true"?', opts: ['true', 'True', 'TRUE', 'yes'], correct: 1, explain: 'Python uses <code>True</code> (capital T). This is different from many other languages. You\'ll see it constantly in Odoo — for example, <code>required=True</code> on a field.' },
  { q: 'What does <code>#</code> mean at the start of a line?', opts: ['It\'s a number', 'It\'s a comment — Python ignores that line', 'It deletes something', 'It\'s an error'], correct: 1, explain: 'The <code>#</code> symbol starts a comment. Everything after it on that line is ignored by Python. Developers use it to write notes in their code.' },
  { q: 'What is wrong with: <code>name = Sales Order</code> ?', opts: ['Nothing wrong', 'Text needs quotes: "Sales Order"', 'name is a reserved word', 'You can\'t use spaces'], correct: 1, explain: 'Text (strings) must be wrapped in quotes: <code>"Sales Order"</code> or <code>\'Sales Order\'</code>. Without quotes, Python thinks <code>Sales</code> and <code>Order</code> are variable names.' },
])}
` },

      { id: 'm1l2', title: 'If/Else: Making Decisions', content: () => `
<h2>If/Else: Making Decisions</h2>
<p>Code often needs to make decisions: "if this condition is true, do this thing." This is the most common pattern you'll see in Odoo.</p>

<h3>Basic If Statement</h3>
${CB('python', `if order.state == 'draft':
    print("This is a quotation")`)}

${AN('<strong>Line 1:</strong> "IF the order\'s state equals \'draft\', THEN..."<br><strong>Line 2:</strong> "...print this message." Notice the 4 spaces at the beginning — this tells Python that this line is INSIDE the if.')}

${CO('warning', 'Indentation = Structure', 'In Python, <strong>spaces at the beginning of a line matter!</strong> The 4 spaces (or a tab) before <code>print</code> tell Python that line belongs to the <code>if</code>. Think of it like nesting — indented lines are "inside" the line above them.')}

<h3>If / Else</h3>
${CB('python', `if order.state == 'sale':
    print("This order is confirmed")
else:
    print("This order is NOT confirmed")`)}

${AN('<strong>Translation:</strong> "IF the order\'s state is \'sale\', print \'confirmed\'. OTHERWISE (else), print \'NOT confirmed\'."')}

<h3>If / Elif / Else (Multiple Choices)</h3>
${CB('python', `if order.state == 'draft':
    print("Quotation")
elif order.state == 'sale':
    print("Confirmed order")
elif order.state == 'cancel':
    print("Cancelled")
else:
    print("Something else")`)}

${AN('<code>elif</code> means "else if" — it\'s another condition to check. Python checks them top to bottom and runs the FIRST one that matches. <code>else</code> catches everything that didn\'t match any condition above it.')}

<h3>Comparison Symbols</h3>
${CT([
  ['Symbol', 'Meaning', 'Example'],
  ['<code>==</code>', 'Equals (is it the same?)', '<code>state == \'draft\'</code>'],
  ['<code>!=</code>', 'Not equals (is it different?)', '<code>state != \'cancel\'</code>'],
  ['<code>></code>', 'Greater than', '<code>amount > 1000</code>'],
  ['<code><</code>', 'Less than', '<code>quantity < 0</code>'],
  ['<code>>=</code>', 'Greater than or equal', '<code>amount >= 100</code>'],
  ['<code><=</code>', 'Less than or equal', '<code>price <= 0</code>'],
])}

${CO('warning', '== vs =', 'One equals sign (<code>=</code>) means "store this value." Two equals signs (<code>==</code>) means "check if these are the same." This is a very common mistake to look out for.')}

<h3>Combining Conditions</h3>
${CB('python', `# AND - both must be true
if order.state == 'draft' and order.amount_total > 0:
    print("Valid draft order")

# OR - at least one must be true
if state == 'draft' or state == 'sent':
    print("Not confirmed yet")

# NOT - reverses the condition
if not order.partner_id:
    print("No customer set!")`)}

${AN('<code>and</code> = both conditions must be true<br><code>or</code> = at least one must be true<br><code>not</code> = flips true to false and false to true')}

<h3>Checking for Empty Values</h3>
${CB('python', `# In Odoo, empty relational fields are False (not None!)
if order.partner_id:
    print("Customer is set")
else:
    print("No customer!")

# This is the same as:
if order.partner_id != False:
    print("Customer is set")`)}

${CO('info', 'Odoo Specialty', 'In Odoo, when a field is empty (like no customer selected), its value is <code>False</code>, not <code>None</code>. So <code>if order.partner_id:</code> means "if a customer is set." If no customer is selected, <code>partner_id</code> is <code>False</code>.')}

${QZ([
  { q: 'What does <code>==</code> mean in Python?', opts: ['Store a value', 'Check if two things are equal', 'Make something equal', 'An error'], correct: 1, explain: '<code>==</code> is a comparison: "are these the same?" One <code>=</code> stores a value (<code>x = 5</code>). Two <code>==</code> checks equality (<code>x == 5</code>).' },
  { q: 'Why are spaces at the start of a line important?', opts: ['They make code look pretty', 'They tell Python which lines belong together (inside an if, loop, etc.)', 'They are optional', 'They create comments'], correct: 1, explain: 'Python uses indentation (spaces) instead of braces. Lines indented under an <code>if</code> are the code that runs when the condition is true. Wrong indentation = error.' },
  { q: 'In Odoo, what is the value of an empty Many2one field (like no customer selected)?', opts: ['None', 'null', 'False', '0'], correct: 2, explain: 'In Odoo, empty relational fields are <code>False</code> (not None). This is important — it\'s why you see <code>if record.partner_id:</code> to check "is a customer set?"' },
])}
` },

      { id: 'm1l3', title: 'Loops and Lists', content: () => `
<h2>Loops and Lists</h2>
<p>Odoo often needs to go through multiple records — like checking every line on a sales order. That's what loops do.</p>

<h3>Lists: Multiple Items</h3>
<p>A list is like a column in a spreadsheet — multiple values stored together:</p>

${CB('python', `states = ['draft', 'sent', 'sale', 'done', 'cancel']
prices = [10.00, 25.50, 99.99]
numbers = [1, 2, 3, 4, 5]`)}

${AN('Square brackets <code>[ ]</code> create a list. Items are separated by commas. You can put any type of data in a list.')}

<h3>For Loops: Going Through Each Item</h3>
${CB('python', `for line in order.order_line:
    print(line.product_id.name)
    print(line.quantity)`)}

${AN('<strong>Translation:</strong> "For EACH line in the order\'s list of order lines, print the product name and quantity."<br><br>This is like scrolling through each row of a table in a spreadsheet, one row at a time.')}

${CO('info', 'Think of it like...', 'A <code>for</code> loop is like going through a stack of papers one by one. <code>for line in order.order_line:</code> means "pick up each order line, one at a time, and call it <code>line</code>. Then do the indented stuff with it."')}

<h3>The Most Important Loop in Odoo</h3>
<p>You will see this pattern <strong>everywhere</strong> in Odoo code:</p>

${CB('python', `for record in self:
    record.amount_total = record.amount_untaxed + record.amount_tax`)}

${AN('<strong>Why <code>for record in self</code>?</strong> In Odoo, <code>self</code> can contain ONE record or MANY records at once. This loop makes sure the code works whether there\'s 1 record or 100. It goes through each one and does the calculation.')}

${CO('warning', 'Very Common Error', 'If code does <code>self.partner_id.name</code> WITHOUT the loop, and <code>self</code> has more than one record, Odoo crashes with: <strong>"Expected singleton"</strong>. This means "I expected one record but got multiple." The fix is always: add a <code>for record in self:</code> loop.')}

<h3>Dictionaries: Named Information</h3>
<p>A dictionary stores information with labels (keys), like a form with named fields:</p>

${CB('python', `vals = {
    'name': 'SO001',
    'state': 'draft',
    'amount_total': 1500.00,
}`)}

${AN('Curly braces <code>{ }</code> create a dictionary. Each item has a <strong>key</strong> (like <code>\'name\'</code>) and a <strong>value</strong> (like <code>\'SO001\'</code>), separated by a colon <code>:</code>.<br><br>Think of it like a form: the key is the field label, the value is what you filled in.')}

<p>You access a value using its key:</p>
${CB('python', `vals['name']        # Returns 'SO001'
vals['state']       # Returns 'draft'
vals.get('name')    # Also returns 'SO001', but safer`)}

${CO('tip', 'In Odoo', 'You\'ll see dictionaries everywhere — they\'re how Odoo passes data around. When you see <code>.create({\'name\': \'SO001\'})</code>, that dictionary is the data for the new record.')}

${QZ([
  { q: 'What does <code>for line in order.order_line:</code> do?', opts: ['Deletes all order lines', 'Creates a new order line', 'Goes through each order line one by one', 'Counts the order lines'], correct: 2, explain: 'A <code>for</code> loop goes through each item in a list. Here it picks up each order line, one at a time, and calls it <code>line</code>. The indented code below runs once for each line.' },
  { q: 'You see the error "Expected singleton." What does this mean?', opts: ['A record is missing', 'Code expected ONE record but got MULTIPLE — needs a for loop', 'The database has a problem', 'A field is empty'], correct: 1, explain: '"Expected singleton" means the code tried to do something that only works with one record, but <code>self</code> contained multiple records. The fix is to add <code>for record in self:</code>.' },
  { q: 'What is <code>{\'name\': \'SO001\', \'state\': \'draft\'}</code>?', opts: ['A list', 'A dictionary — named pairs of data', 'An error', 'A function'], correct: 1, explain: 'This is a dictionary: pairs of keys and values, like a small form. <code>\'name\'</code> is the label (key), <code>\'SO001\'</code> is the data (value).' },
])}
` },
    ]
  },

    lessons: [
      { id: 'm2l1', title: 'What Is a Model?', content: () => `
<h2>What Is a Model?</h2>
<p>Every "thing" in Odoo — a sales order, a customer, a product, an invoice — is defined by a <strong>model</strong>. A model is like a spreadsheet template: it defines what columns (fields) exist and what type of data goes in each.</p>

<h3>A Simple Model</h3>
${CB('python', `from odoo import models, fields

class LibraryBook(models.Model):
    _name = 'library.book'
    _description = 'Library Book'

    name = fields.Char(string='Title', required=True)
    author = fields.Char(string='Author')
    pages = fields.Integer(string='Number of Pages')
    is_available = fields.Boolean(string='Available', default=True)`)}

${AN('<strong>Line 1:</strong> Import tools from Odoo (needed in every model file).<br><br><strong>Line 3:</strong> Create a new model called <code>LibraryBook</code>. The <code>(models.Model)</code> part means "this is a standard Odoo model."<br><br><strong>Line 4:</strong> <code>_name = \'library.book\'</code> — This is the <strong>technical name</strong>. It\'s how Odoo identifies this model everywhere. In the database, dots become underscores: table = <code>library_book</code>.<br><br><strong>Line 5:</strong> <code>_description</code> — A human-readable name.<br><br><strong>Lines 7-10:</strong> The fields — each one is a column in the database table.')}

${CO('info', 'Think of it like...', 'A model is a <strong>spreadsheet template</strong>:<br>- <code>_name</code> = the spreadsheet\'s name<br>- Each <code>fields.XXX</code> = a column<br>- Each record = a row<br><br>So <code>library.book</code> is a spreadsheet called "library_book" with columns: Title, Author, Number of Pages, Available.')}

<h3>Common Model Names You'll See</h3>
${CT([
  ['Model Name', 'What It Is'],
  ['<code>res.partner</code>', 'Contacts (customers, vendors, companies)'],
  ['<code>sale.order</code>', 'Sales orders / Quotations'],
  ['<code>sale.order.line</code>', 'Lines on a sales order'],
  ['<code>account.move</code>', 'Invoices / Journal entries'],
  ['<code>account.move.line</code>', 'Invoice lines / Journal items'],
  ['<code>product.product</code>', 'Products (specific variants)'],
  ['<code>product.template</code>', 'Product templates (the main product)'],
  ['<code>stock.picking</code>', 'Delivery orders / Receipts'],
])}

${CO('tip', 'In Developer Mode', 'When you enable Developer Mode and hover over a field, Odoo shows you the model name (e.g., <code>sale.order</code>). This is the <code>_name</code> value. You can use it to find the code file!')}

<h3>Finding the File</h3>
<p>To find the Python file for a model:</p>
<ol>
<li>Take the model name: <code>sale.order</code></li>
<li>The part before the first dot is the module: <code>sale</code></li>
<li>Replace dots with underscores for the filename: <code>sale_order.py</code></li>
<li>Look in: <code>sale/models/sale_order.py</code></li>
</ol>

${QZ([
  { q: 'If a model has <code>_name = \'account.move\'</code>, what is the database table called?', opts: ['account.move', 'account_move', 'AccountMove', 'account-move'], correct: 1, explain: 'Odoo converts dots to underscores. <code>account.move</code> becomes the database table <code>account_move</code>.' },
  { q: 'What is a "model" in Odoo?', opts: ['A 3D object', 'A template that defines what data is stored — like a spreadsheet with named columns', 'A type of report', 'A user interface element'], correct: 1, explain: 'A model defines the structure of data — what fields exist and what type they are. Each model becomes a database table where records are stored.' },
])}
` },

      { id: 'm2l2', title: 'Field Types', content: () => `
<h2>Field Types</h2>
<p>Fields are the columns of your "spreadsheet." Each field type stores a specific kind of data.</p>

<h3>Simple Fields</h3>
${CB('python', `# Text fields
name = fields.Char(string='Name')          # Short text (one line)
description = fields.Text(string='Notes')   # Long text (multiple lines)

# Number fields
quantity = fields.Integer(string='Quantity')     # Whole numbers: 1, 2, 3
price = fields.Float(string='Price')             # Decimal numbers: 19.99
amount = fields.Monetary(string='Total')         # Money (with currency)

# Yes/No field
active = fields.Boolean(string='Active', default=True)

# Date fields
date_order = fields.Date(string='Order Date')
create_date = fields.Datetime(string='Created On')

# Dropdown (Selection)
state = fields.Selection([
    ('draft', 'Draft'),
    ('confirmed', 'Confirmed'),
    ('done', 'Done'),
], string='Status', default='draft')`)}

${AN('<strong>Char</strong> = short text (name, email, reference number)<br><strong>Text</strong> = long text (description, notes)<br><strong>Integer</strong> = whole numbers (quantity, sequence)<br><strong>Float</strong> = decimal numbers (price, percentage)<br><strong>Monetary</strong> = money with currency symbol<br><strong>Boolean</strong> = checkbox (yes/no, true/false)<br><strong>Date / Datetime</strong> = dates and timestamps<br><strong>Selection</strong> = dropdown list with fixed options')}

<h3>Selection Fields (Dropdowns)</h3>
<p>Selection fields are very common. They store a <strong>code</strong> but display a <strong>label</strong>:</p>

${CB('python', `state = fields.Selection([
    ('draft', 'Draft'),           # 'draft' = stored in database
    ('confirmed', 'Confirmed'),   # 'Confirmed' = shown to user
    ('done', 'Done'),
], string='Status', default='draft')`)}

${CO('warning', 'Important!', 'The database stores <code>\'draft\'</code> (the code), NOT <code>\'Draft\'</code> (the label). When you see code checking the state, it always uses the code: <code>if record.state == \'draft\'</code> — never <code>\'Draft\'</code>.')}

<h3>Field Options You'll See</h3>
${CT([
  ['Option', 'What it does', 'Example'],
  ['<code>string=</code>', 'The label shown in the UI', '<code>string=\'Customer Name\'</code>'],
  ['<code>required=True</code>', 'This field cannot be empty', 'Name on a sales order'],
  ['<code>default=</code>', 'Value for new records', '<code>default=\'draft\'</code>'],
  ['<code>readonly=True</code>', 'Cannot be edited in UI', 'Computed totals'],
  ['<code>help=</code>', 'Tooltip when you hover', 'Explanation text'],
  ['<code>tracking=True</code>', 'Changes appear in chatter', 'Status changes, amount changes'],
])}

<h3>The Special "active" Field</h3>
<p>If a model has <code>active = fields.Boolean(default=True)</code>, then setting <code>active=False</code> <strong>archives</strong> the record — it disappears from normal views but still exists in the database.</p>

${CO('support', 'Support Tip', 'If a customer says "my product/contact/record disappeared!" — it might be archived. In Developer Mode, add the filter <code>(\'active\', \'=\', False)</code> to find it, or use the "Include Archived" filter.')}

${QZ([
  { q: 'What is the difference between <code>fields.Char</code> and <code>fields.Text</code>?', opts: ['Char is for numbers', 'Char = short text (one line), Text = long text (multiple lines)', 'They are the same', 'Text is for HTML'], correct: 1, explain: 'Char renders as a single-line input box. Text renders as a multi-line text area. Use Char for names/references, Text for descriptions/notes.' },
  { q: 'A Selection field stores <code>(\'draft\', \'Draft\')</code>. What value is saved in the database?', opts: ['Draft', 'draft', 'Both', '0'], correct: 1, explain: 'The FIRST value in each pair is stored in the database (<code>\'draft\'</code>). The SECOND value (<code>\'Draft\'</code>) is just the label shown to users.' },
])}
` },

      { id: 'm2l3', title: 'Relational Fields: How Data Connects', content: () => `
<h2>Relational Fields: How Data Connects</h2>
<p>A sales order needs a customer. An invoice has invoice lines. A product belongs to a category. These connections are made with <strong>relational fields</strong>.</p>

<h3>Many2one: "This record points to ONE other record"</h3>
<p>Think of a dropdown where you select ONE option:</p>

${CB('python', `partner_id = fields.Many2one('res.partner', string='Customer')`)}

${AN('This field connects to the <code>res.partner</code> model (contacts). On the form, it appears as a dropdown where you pick ONE customer. In the database, it stores just the customer\'s ID number (like 42).')}

${CO('info', 'Think of it like...', 'Many2one is like a "lookup" in a spreadsheet — it points to one row in another table. A sales order\'s "Customer" field points to one specific contact.')}

<h3>One2many: "This record has MANY related records"</h3>
<p>Think of the lines on a sales order — one order has many lines:</p>

${CB('python', `# On the Sales Order model:
order_line = fields.One2many('sale.order.line', 'order_id', string='Order Lines')`)}

${AN('This says: "A sales order has many order lines." The <code>\'order_id\'</code> part tells Odoo which field on the ORDER LINE points back to the order. One2many fields don\'t store anything in the database — they just show the related records.')}

<h3>Many2many: "Multiple to multiple"</h3>
<p>Think of tags — a product can have many tags, and a tag can be on many products:</p>

${CB('python', `tag_ids = fields.Many2many('crm.tag', string='Tags')`)}

<h3>Naming Convention</h3>
<p>You can guess the field type from its name:</p>

${CT([
  ['Name ends with', 'It\'s probably', 'Example'],
  ['<code>_id</code>', 'Many2one (points to ONE record)', '<code>partner_id</code>, <code>company_id</code>'],
  ['<code>_ids</code>', 'One2many or Many2many (points to MANY)', '<code>tag_ids</code>, <code>invoice_ids</code>'],
])}

<h3>Following the Chain</h3>
<p>You can follow relational fields with dots, like following a trail:</p>

${CB('python', `order.partner_id                    # The customer record
order.partner_id.name               # The customer's name
order.partner_id.email              # The customer's email
order.partner_id.country_id.name    # The customer's country name`)}

${AN('<code>order.partner_id</code> = go to the customer<br><code>.name</code> = get their name<br><code>.country_id</code> = go to their country<br><code>.name</code> = get the country\'s name<br><br>You\'re following a chain: Order → Customer → Country → Country Name')}

${CO('warning', 'Common Error', 'If <code>partner_id</code> is empty (no customer selected), it\'s <code>False</code>. And <code>False.name</code> causes an error: <strong>AttributeError: \'bool\' object has no attribute \'name\'</strong>. This is one of the most common errors in Odoo!')}

${QZ([
  { q: 'A field is called <code>partner_id</code> (ends with _id). What type is it probably?', opts: ['Text field', 'Many2one — points to ONE record', 'Many2many — points to many records', 'Integer'], correct: 1, explain: 'Fields ending in <code>_id</code> are almost always Many2one — they point to one specific record in another model. <code>partner_id</code> points to one contact.' },
  { q: 'What does <code>order.partner_id.country_id.name</code> do?', opts: ['Creates a new country', 'Follows the chain: order → customer → their country → country name', 'Causes an error', 'Deletes the country'], correct: 1, explain: 'It follows the relational chain step by step. Each dot goes one step further through the linked records.' },
])}
` },
    ]
  },

  {
    id: 'm3', icon: '\u{2699}\u{FE0F}',
    title: 'How Odoo Works',
    desc: 'Classes, self, super(), decorators — the patterns you see everywhere in Odoo.',
    lessons: [
      { id: 'm3l1', title: 'Classes and self', content: () => `
<h2>Classes and "self"</h2>
<p>Every Odoo model is built using something called a <strong>class</strong>. You don't need to understand classes deeply — just know how to read them.</p>

<h3>What is a Class?</h3>
<p>A class is like a <strong>blueprint</strong>. The model is the blueprint, and each record is a thing built from that blueprint:</p>

${CB('python', `class SaleOrder(models.Model):
    _name = 'sale.order'

    name = fields.Char(string='Order Reference')
    state = fields.Selection([...])

    def action_confirm(self):
        self.write({'state': 'sale'})`)}

${AN('<strong>Line 1:</strong> <code>class SaleOrder(models.Model):</code> — This defines the model. <code>SaleOrder</code> is the class name, <code>models.Model</code> means it\'s a regular Odoo model.<br><br><strong>Lines 4-5:</strong> Field definitions — the data this model stores.<br><br><strong>Lines 7-8:</strong> A <strong>method</strong> (function) that belongs to this model. This one confirms the order by setting the state to \'sale\'.')}

<h3>What is "self"?</h3>
<p><code>self</code> is the word Python uses to refer to <strong>"the current record(s)"</strong>. When you click "Confirm" on a sales order, <code>self</code> IS that sales order.</p>

${CB('python', `def action_confirm(self):
    # self = the record(s) this method is running on
    self.write({'state': 'sale'})
    # This changes the state of the current record(s) to 'sale'`)}

${CO('info', 'Think of it like...', '<code>self</code> is like saying "this record" or "me." When you click a button on Sales Order SO001, <code>self</code> IS SO001. When the code says <code>self.name</code>, it means "the name of the record I\'m working on."')}

<h3>Every Method Has "self" First</h3>
<p>You'll notice every method (function) in an Odoo model starts with <code>self</code>:</p>

${CB('python', `def action_confirm(self):        # self is always first
    ...

def compute_total(self):         # self is always first
    ...

def _check_quantity(self):       # self is always first
    ...`)}

${AN('This is just how Python works — every method in a class must have <code>self</code> as its first parameter. It\'s automatic. You can just treat it as "the current record."')}

<h3>What is super()?</h3>
<p><code>super()</code> means "do what the original code does." When a custom module changes how "Confirm" works, it uses <code>super()</code> to still run the original logic:</p>

${CB('python', `def action_confirm(self):
    result = super().action_confirm()    # Run the ORIGINAL confirm logic
    self._send_notification()            # Then do extra stuff
    return result`)}

${AN('<strong>Line 2:</strong> <code>super().action_confirm()</code> = "First, run the normal confirm process (from the original Odoo code)."<br><strong>Line 3:</strong> Then add extra behavior — in this case, send a notification.<br><br>Without <code>super()</code>, the original code would be skipped entirely!')}

${CO('warning', 'When super() is missing', 'If a custom module\'s <code>action_confirm</code> does NOT call <code>super()</code>, the entire original confirm logic is skipped. This is almost always a bug — it means the order state won\'t change, stock rules won\'t run, etc.')}

${QZ([
  { q: 'What does <code>self</code> refer to in a method?', opts: ['The Odoo server', 'The current record(s) the method is running on', 'The current user', 'The database'], correct: 1, explain: '<code>self</code> means "the current record(s)." When you click a button on a specific sales order, <code>self</code> is that sales order.' },
  { q: 'What does <code>super().action_confirm()</code> do?', opts: ['Deletes the record', 'Runs the ORIGINAL version of action_confirm (before customization)', 'Creates a super user', 'Cancels the confirm'], correct: 1, explain: '<code>super()</code> calls the original method. Custom modules use it to say "first do everything the original code does, then add my extra stuff."' },
])}
` },

      { id: 'm3l2', title: 'Decorators and Computed Fields', content: () => `
<h2>Decorators and Computed Fields</h2>
<p>When you see <code>@something</code> above a method, that's a <strong>decorator</strong>. It tells Odoo WHEN to run that method.</p>

<h3>@api.depends — "Recalculate When..."</h3>
<p>This is the most common decorator. It says: "When these fields change, run this calculation."</p>

${CB('python', `price_subtotal = fields.Float(compute='_compute_subtotal', store=True)

@api.depends('quantity', 'price_unit')
def _compute_subtotal(self):
    for line in self:
        line.price_subtotal = line.quantity * line.price_unit`)}

${AN('<strong>Line 1:</strong> <code>price_subtotal</code> is a <strong>computed field</strong> — its value is calculated, not typed in by users. <code>compute=</code> tells Odoo which method does the calculation.<br><br><strong>Line 3:</strong> <code>@api.depends(\'quantity\', \'price_unit\')</code> means "recalculate whenever quantity OR price_unit changes."<br><br><strong>Lines 4-6:</strong> The method loops through each record (<code>for line in self</code>) and calculates: subtotal = quantity x unit price.')}

${CO('info', 'Why computed fields matter', 'When you see a field that shows a calculated value (like a total), it\'s a computed field. If the total shows a wrong number, you need to find the compute method to understand HOW it\'s calculated.')}

<h3>@api.onchange — "When the User Changes..."</h3>
<p>Runs in the browser when a user changes a field (BEFORE saving):</p>

${CB('python', `@api.onchange('partner_id')
def _onchange_partner(self):
    if self.partner_id:
        self.payment_term_id = self.partner_id.property_payment_term_id`)}

${AN('<strong>Translation:</strong> "When the user selects a different customer in the form, automatically fill in the payment terms from that customer\'s settings."<br><br>This runs in real-time as you fill the form — it\'s what makes fields auto-fill when you select something.')}

<h3>@api.constrains — "Validate When Saving"</h3>
${CB('python', `@api.constrains('quantity')
def _check_quantity(self):
    for line in self:
        if line.quantity <= 0:
            raise ValidationError("Quantity must be positive!")`)}

${AN('This runs when you SAVE a record. It checks if the quantity is valid. If not, it shows an error message and prevents the save.')}

<h3>Summary of Decorators</h3>
${CT([
  ['Decorator', 'When does it run?', 'What is it for?'],
  ['<code>@api.depends()</code>', 'When listed fields change', 'Computing field values (totals, subtotals)'],
  ['<code>@api.onchange()</code>', 'When user changes a field in the form', 'Auto-filling related fields'],
  ['<code>@api.constrains()</code>', 'When saving a record', 'Validating data (showing errors)'],
  ['<code>@api.model</code>', 'Called on the model, not records', 'Default values, general operations'],
])}

${QZ([
  { q: 'What does <code>@api.depends(\'quantity\', \'price_unit\')</code> mean?', opts: ['Delete quantity and price_unit', 'Recalculate this field whenever quantity or price_unit changes', 'This method creates those fields', 'This method requires those parameters'], correct: 1, explain: '<code>@api.depends</code> lists the "trigger" fields. When ANY of them change, Odoo automatically runs the method below it to recalculate the computed field.' },
  { q: 'A field shows a wrong total. Where do you look?', opts: ['The XML view', 'The <code>compute=</code> method and its <code>@api.depends</code>', 'The database directly', 'The browser console'], correct: 1, explain: 'Find the field definition, look at <code>compute=\'_compute_xxx\'</code>, then find that method and check the <code>@api.depends</code> to understand what triggers the calculation and how it\'s calculated.' },
])}
` },

      { id: 'm3l3', title: 'Inheritance: Adding to Existing Code', content: () => `
<h2>Inheritance: Adding to Existing Code</h2>
<p>Odoo modules extend each other. A custom module can add fields and change behavior of existing models WITHOUT changing the original code.</p>

<h3>Extending an Existing Model</h3>
${CB('python', `class SaleOrder(models.Model):
    _inherit = 'sale.order'

    loyalty_points = fields.Integer(string='Loyalty Points')

    def action_confirm(self):
        result = super().action_confirm()
        self._calculate_loyalty_points()
        return result`)}

${AN('<strong>Line 2:</strong> <code>_inherit = \'sale.order\'</code> means "I\'m EXTENDING the existing sale.order model." This is NOT creating a new model — it\'s adding to the existing one.<br><br><strong>Line 4:</strong> Adds a new field <code>loyalty_points</code> to ALL sales orders.<br><br><strong>Lines 6-9:</strong> Changes what happens when you confirm an order. <code>super()</code> runs the original confirm, then it adds loyalty point calculation.')}

${CO('info', 'Think of it like...', 'Inheritance is like a sticky note on an existing form. The original form stays the same, but you\'re sticking extra fields and instructions on top of it. The <code>_inherit</code> line says "which form I\'m adding to."')}

<h3>How to Spot It</h3>
<p>When you see <code>_inherit = \'sale.order\'</code> WITHOUT a <code>_name</code> line, it's extending the existing model. If you see BOTH <code>_inherit</code> AND <code>_name</code>, it's creating a new model (less common).</p>

${CT([
  ['Code', 'What it does'],
  ['<code>_inherit = \'sale.order\'</code> (no _name)', 'EXTENDS the existing sale.order — adds fields/methods to it'],
  ['<code>_name = \'custom.order\'</code> + <code>_inherit = \'sale.order\'</code>', 'Creates a NEW model by copying sale.order'],
])}

<h3>Why This Matters for Support</h3>
<p>When investigating an issue, a field or behavior might come from ANY module that inherits the model. If you can't find a field in the main module, check custom/third-party modules that use <code>_inherit</code>.</p>

${CO('support', 'Investigation Tip', 'If you search for a field like <code>loyalty_points</code> in <code>sale/models/sale_order.py</code> and can\'t find it, search ALL modules for <code>_inherit = \'sale.order\'</code> — the field might be added by a custom module.')}

${QZ([
  { q: 'What does <code>_inherit = \'sale.order\'</code> (without _name) do?', opts: ['Creates a new model', 'Extends the existing sale.order — adds fields and methods to it', 'Deletes sale.order', 'Copies sale.order to a new table'], correct: 1, explain: 'When <code>_inherit</code> is used WITHOUT <code>_name</code>, it extends the existing model. New fields are added to the same database table. Existing methods can be overridden.' },
])}
` },

  {
    id: 'm4', icon: '\u{1F4C4}',
    title: 'XML Views',
    desc: 'Understand what you see on screen — forms, buttons, lists, and how they connect to code.',
    lessons: [
      { id: 'm4l1', title: 'What is XML?', content: () => `
<h2>What is XML?</h2>
<p>XML is the language Odoo uses to define <strong>what you see on screen</strong> — the forms, lists, buttons, and menus. If you've seen HTML (web pages), XML looks very similar.</p>

<h3>XML Basics</h3>
${CB('xml', `<form string="Sales Order">
    <field name="partner_id"/>
    <field name="date_order"/>
</form>`)}

${AN('<strong>Line 1:</strong> <code>&lt;form&gt;</code> starts a form view.<br><strong>Lines 2-3:</strong> <code>&lt;field name="partner_id"/&gt;</code> means "show the partner_id field here." The <code>/&gt;</code> at the end is a self-closing tag (no separate closing tag needed).<br><strong>Line 4:</strong> <code>&lt;/form&gt;</code> ends the form.')}

<h3>Key Rules</h3>
<ul>
<li>Tags must always close: either <code>&lt;field name="x"&gt;&lt;/field&gt;</code> or self-closing <code>&lt;field name="x"/&gt;</code></li>
<li>Attribute values always need quotes: <code>name="partner_id"</code></li>
<li>Tags are case-sensitive: <code>&lt;field&gt;</code> works, <code>&lt;Field&gt;</code> doesn't</li>
</ul>

<h3>The Record Wrapper</h3>
<p>Views in Odoo are stored as records in the database. They're wrapped in a <code>&lt;record&gt;</code> tag:</p>

${CB('xml', `<record id="view_order_form" model="ir.ui.view">
    <field name="name">sale.order.form</field>
    <field name="model">sale.order</field>
    <field name="arch" type="xml">
        <form string="Sales Order">
            <field name="partner_id"/>
        </form>
    </field>
</record>`)}

${AN('<strong>id="view_order_form"</strong> — A unique identifier for this view. You\'ll see this in Developer Mode.<br><br><strong>model="ir.ui.view"</strong> — This record is a view definition.<br><br><strong>name: sale.order.form</strong> — The view\'s name.<br><br><strong>model: sale.order</strong> — This view is for the sale.order model.<br><br><strong>&lt;field name="arch"&gt;</strong> — The actual view layout goes inside here. "arch" means "architecture."')}

${CO('tip', 'In Developer Mode', 'When you click Debug Menu → Edit View, you see the XML inside <code>&lt;field name="arch"&gt;</code>. The id (like <code>sale.view_order_form</code>) is shown in the debug info.')}

${QZ([
  { q: 'What does <code>&lt;field name="partner_id"/&gt;</code> do in a form view?', opts: ['Creates a new field', 'Displays the partner_id field on the form', 'Deletes the partner_id field', 'Renames the field'], correct: 1, explain: 'In XML views, <code>&lt;field name="partner_id"/&gt;</code> tells Odoo to show that field at this position in the form.' },
])}
` },

      { id: 'm4l2', title: 'Reading Form Views', content: () => `
<h2>Reading Form Views</h2>
<p>Let's learn to read a real Odoo form view — the kind you see when you open an invoice or sales order.</p>

<h3>The Main Sections</h3>
${CB('xml', `<form string="Account Entry">
    <header>
        <!-- Buttons and status bar go here -->
    </header>
    <sheet>
        <!-- Main content goes here -->
    </sheet>
    <div class="oe_chatter">
        <!-- Chat/log notes go here -->
    </div>
</form>`)}

${AN('<strong>&lt;header&gt;</strong> — The top bar with buttons (Confirm, Send, Pay) and the status bar<br><strong>&lt;sheet&gt;</strong> — The main content area (looks like a white paper sheet)<br><strong>&lt;div class="oe_chatter"&gt;</strong> — The chatter at the bottom (messages, log notes, followers)')}

<h3>Reading Buttons</h3>
<p>Here's a real button from the Account Move (invoice) form:</p>

${CB('xml', `<button name="action_post"
        string="Confirm"
        class="oe_highlight"
        type="object"
        groups="account.group_account_invoice"
        invisible="hide_post_button or move_type == 'entry'"
/>`)}

${AN('<strong>name="action_post"</strong> — When clicked, run the Python method called <code>action_post</code><br><br><strong>string="Confirm"</strong> — The text shown on the button<br><br><strong>class="oe_highlight"</strong> — Make the button purple/highlighted (the primary action)<br><br><strong>type="object"</strong> — This calls a Python method (not an action or URL)<br><br><strong>groups="account.group_account_invoice"</strong> — Only users in the "Invoicing" group can see this button<br><br><strong>invisible="hide_post_button or move_type == \'entry\'"</strong> — Hide this button when <code>hide_post_button</code> is true OR when the move type is \'entry\'')}

${CO('info', 'Reading "invisible"', 'The <code>invisible</code> attribute controls WHEN a button or field is hidden. It\'s a condition: when it\'s true, the element disappears. In the example above, the "Confirm" button is hidden when <code>hide_post_button</code> is true (the invoice can\'t be confirmed) or when <code>move_type == \'entry\'</code> (it\'s a journal entry, not an invoice).')}

<h3>Groups and Columns</h3>
${CB('xml', `<sheet>
    <group>
        <group string="Customer Info">
            <field name="partner_id"/>
            <field name="date_order"/>
        </group>
        <group string="Payment">
            <field name="payment_term_id"/>
            <field name="currency_id"/>
        </group>
    </group>
</sheet>`)}

${AN('A <code>&lt;group&gt;</code> inside a <code>&lt;group&gt;</code> creates a <strong>two-column layout</strong>. The inner groups become left and right columns. The <code>string</code> attribute gives each column a title.')}

<h3>Notebook (Tabs)</h3>
${CB('xml', `<notebook>
    <page string="Order Lines" name="order_lines">
        <field name="order_line"/>
    </page>
    <page string="Other Info" name="other_info">
        <field name="note"/>
    </page>
</notebook>`)}

${AN('<code>&lt;notebook&gt;</code> creates tabs at the bottom of the form. Each <code>&lt;page&gt;</code> is one tab. <code>string</code> is the tab\'s title.')}

${QZ([
  { q: 'A button has <code>type="object"</code> and <code>name="action_post"</code>. What happens when you click it?', opts: ['It opens a URL', 'It calls the Python method called action_post', 'It opens a popup', 'It saves the record'], correct: 1, explain: '<code>type="object"</code> means the button calls a Python method. The method name is in the <code>name</code> attribute. So clicking this button runs <code>action_post()</code> on the current record.' },
  { q: 'What does <code>invisible="state != \'draft\'"</code> mean?', opts: ['The field is deleted when not in draft', 'The field is HIDDEN when the state is NOT draft (only visible in draft)', 'The field is always invisible', 'The field is required'], correct: 1, explain: 'The element is hidden when the condition is true. <code>state != \'draft\'</code> means "state is not draft" — so the element is visible ONLY in draft state.' },
])}
` },

      { id: 'm4l3', title: 'View Inheritance: Modifying Views', content: () => `
<h2>View Inheritance: Modifying Views</h2>
<p>Just like Python models can be extended, XML views can too. A custom module can add fields and buttons to existing views without changing the original file.</p>

<h3>How It Works</h3>
${CB('xml', `<record id="view_order_form_inherit_custom" model="ir.ui.view">
    <field name="name">sale.order.form.inherit.custom</field>
    <field name="model">sale.order</field>
    <field name="inherit_id" ref="sale.view_order_form"/>
    <field name="arch" type="xml">

        <xpath expr="//field[@name='partner_id']" position="after">
            <field name="loyalty_points"/>
        </xpath>

    </field>
</record>`)}

${AN('<strong>inherit_id</strong> — Points to the ORIGINAL view being modified (the sale order form).<br><br><strong>xpath</strong> — Finds a specific element in the original view. Here: "find the field with name=partner_id."<br><br><strong>position="after"</strong> — "Put my new content AFTER that element."<br><br><strong>Result:</strong> The <code>loyalty_points</code> field appears right after the customer field on the sales order form.')}

<h3>XPath: Finding Elements</h3>
<p>XPath is the language for finding elements in XML. Common patterns:</p>

${CT([
  ['XPath Expression', 'What it finds'],
  ['<code>//field[@name=\'partner_id\']</code>', 'The field named partner_id, anywhere in the view'],
  ['<code>//button[@name=\'action_confirm\']</code>', 'The button named action_confirm'],
  ['<code>//page[@name=\'other_info\']</code>', 'The tab named other_info'],
  ['<code>//header</code>', 'The header section'],
  ['<code>//notebook</code>', 'The notebook (tab container)'],
])}

<h3>Positions: Where to Put Things</h3>
${CT([
  ['Position', 'What it does'],
  ['<code>after</code>', 'Insert AFTER the found element'],
  ['<code>before</code>', 'Insert BEFORE the found element'],
  ['<code>inside</code>', 'Insert INSIDE the element (as last child)'],
  ['<code>replace</code>', 'REPLACE the element completely'],
  ['<code>attributes</code>', 'Change the element\'s attributes (like invisible, string)'],
])}

${CO('support', 'Why this matters for support', 'When a field appears or disappears unexpectedly, it might be because a custom module\'s inherited view is adding/hiding it. In Developer Mode, you can see all inherited views that modify the current view.')}

${QZ([
  { q: 'What does <code>inherit_id</code> do in a view record?', opts: ['Creates a new view', 'Points to the ORIGINAL view being modified', 'Deletes the parent view', 'Copies the view'], correct: 1, explain: '<code>inherit_id</code> tells Odoo which existing view this modification applies to. The XPath inside then finds specific elements in that view to modify.' },
])}
` },
    ]
  },
