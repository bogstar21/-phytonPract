      { id: 'm5l1', title: 'Using Developer Mode', content: () => `
<h2>Using Developer Mode</h2>
<p>Developer Mode is your <strong>superpower</strong> as a support analyst. It shows you the technical information behind everything you see on screen.</p>

<h3>How to Turn It On</h3>
<ol>
<li><strong>Easiest way:</strong> Add <code>?debug=1</code> to the URL<br>Example: <code>https://mydb.odoo.com/web?debug=1</code></li>
<li><strong>Settings way:</strong> Settings → General Settings → scroll down → "Activate the developer mode"</li>
</ol>

<h3>What Changes</h3>
<p>When Developer Mode is on, you get:</p>
<ul>
<li>A <strong>bug icon</strong> in the top menu bar — click it for debug options</li>
<li><strong>Tooltips on fields</strong> — hover over any field label to see its technical name, type, and model</li>
<li><strong>Technical info in the URL</strong> — shows the record ID and model name</li>
</ul>

<h3>The Debug Menu (Bug Icon)</h3>
${CT([
  ['Option', 'What it shows you'],
  ['Edit View: Form', 'The XML of the current form view'],
  ['Edit View: List', 'The XML of the current list view'],
  ['Edit Action', 'The action behind the current menu (model, filters, context)'],
  ['View Fields', 'ALL fields on the current model with their types'],
])}

<h3>The Investigation Workflow</h3>
<p>When a user reports "this field shows wrong data":</p>
<ol>
<li><strong>Enable Developer Mode</strong> on the database</li>
<li><strong>Hover over the field</strong> — note the technical name and model</li>
<li><strong>Find the model file</strong> — convert <code>sale.order</code> → <code>sale/models/sale_order.py</code></li>
<li><strong>Search for the field</strong> — look for <code>field_name = fields.</code></li>
<li><strong>If it's computed</strong> — look at <code>compute=</code> to find the calculation method</li>
<li><strong>Check @api.depends</strong> — what triggers the calculation?</li>
</ol>

${CO('support', 'Real Example', 'User says: "The total on my invoice is wrong."<br>1. Hover over total → technical name: <code>amount_total</code>, model: <code>account.move</code><br>2. Find <code>account/models/account_move.py</code><br>3. Search for <code>amount_total = fields.</code><br>4. It says <code>compute=\'_compute_amount\'</code><br>5. Find <code>_compute_amount</code> → it sums up the invoice lines<br>6. Check individual lines — are THEY correct?')}

${QZ([
  { q: 'How do you find the technical name of a field on screen?', opts: ['Look at the database', 'Enable Developer Mode and hover over the field label', 'Check the Python source code first', 'It\'s shown in the URL'], correct: 1, explain: 'With Developer Mode on, hovering over any field label shows a tooltip with the technical field name, type, and model. This is the fastest way to identify any field.' },
])}
` },
    ]
  },

  {
    id: 'm6', icon: '\u{1F41B}',
    title: 'Reading Error Messages',
    desc: 'The most important skill: understanding tracebacks and common Odoo errors.',
    lessons: [
      { id: 'm6l1', title: 'What is a Traceback?', content: () => `
<h2>What is a Traceback?</h2>
<p>When Odoo crashes, it shows a <strong>traceback</strong> — a trail of breadcrumbs showing exactly what the code was doing when it failed. Learning to read these will save you hours of investigation.</p>

<h3>A Simple Example</h3>
${CB('text', `Traceback (most recent call last):
  File "/odoo/addons/sale/models/sale_order.py", line 812, in _action_confirm
    self.order_line._action_launch_stock_rule()
  File "/odoo/addons/sale_stock/models/sale_order.py", line 145, in _launch_stock
    raise UserError("Not enough stock for product Laptop")
odoo.exceptions.UserError: Not enough stock for product Laptop`)}

<h3>How to Read It: ALWAYS START FROM THE BOTTOM</h3>

${AN('<strong>Step 1 — Read the LAST line:</strong><br><code>UserError: Not enough stock for product Laptop</code><br>This is THE ERROR. It tells you WHAT went wrong.<br><br><strong>Step 2 — Read the line above it:</strong><br><code>raise UserError("Not enough stock...")</code><br>This is WHERE in the code the error happened.<br><br><strong>Step 3 — Read the file path:</strong><br><code>sale_stock/models/sale_order.py, line 145</code><br>This tells you WHICH FILE and WHICH LINE.')}

${CO('tip', 'The Golden Rule', '<strong>Always read tracebacks from BOTTOM to TOP.</strong><br>- Bottom = WHAT went wrong (the error message)<br>- Middle = WHERE it happened (the file and line)<br>- Top = HOW the code got there (the chain of calls)')}

<h3>What to Skip</h3>
<p>You can skip lines that mention internal Odoo framework files. Focus on the lines in <code>addons/</code>:</p>

${CB('text', `  File "/odoo/odoo/http.py", line 2274           ← SKIP (framework)
  File "/odoo/odoo/service/model.py", line 185    ← SKIP (framework)
  File "/odoo/addons/sale/models/sale_order.py"   ← LOOK AT THIS
  File "/odoo/addons/sale_stock/models/sale.py"   ← LOOK AT THIS`)}

${AN('Lines with <code>odoo/http.py</code>, <code>service/model.py</code>, <code>odoo/api.py</code> are internal plumbing — skip them. Focus on lines in <code>addons/</code> — that\'s where the business logic is.')}

<h3>Common Error Types</h3>
${CT([
  ['Error Type', 'What it means', 'What to look for'],
  ['<code>UserError</code>', 'A business rule says "no"', 'An intentional check in the code — like "can\'t confirm without lines"'],
  ['<code>ValidationError</code>', 'Data failed a check', 'A <code>@api.constrains</code> method rejected the data'],
  ['<code>AccessError</code>', 'Permission denied', 'User doesn\'t have the right security group'],
  ['<code>TypeError</code>', 'Wrong type of data', 'Code expected a number but got text, or got None'],
  ['<code>AttributeError</code>', 'Trying to access something that doesn\'t exist', 'Often: accessing a field on an empty (False) relational field'],
  ['<code>ValueError</code>', 'Invalid value', '"Expected singleton" = expected 1 record, got multiple'],
])}

${QZ([
  { q: 'When reading a traceback, where should you start?', opts: ['The very first line at the top', 'The middle', 'The last line at the bottom — that\'s the actual error', 'Any line will do'], correct: 2, explain: 'Always start at the bottom. The last line tells you WHAT the error is. Then work upward to find WHERE it happened (in the addons/ files).' },
  { q: 'Which files should you focus on in a traceback?', opts: ['odoo/http.py and service/model.py', 'Files in addons/ — that\'s the business logic', 'All files equally', 'Only the first file'], correct: 1, explain: 'Files in <code>addons/</code> contain the business logic (sales, invoicing, stock, etc.). Framework files like http.py and model.py are internal plumbing you can skip.' },
])}
` },

      { id: 'm6l2', title: 'Real Traceback Practice', content: () => `
<h2>Real Traceback Practice</h2>
<p>Let's read a REAL traceback from an actual Odoo error, step by step.</p>

<h3>The Error</h3>
${CB('text', `Traceback (most recent call last):
  File "/home/odoo/src/odoo/19.0/odoo/http.py", line 2274, in _serve_db
    return service_model.retrying(serve_func, env=self.env)
  File "/home/odoo/src/odoo/19.0/odoo/service/model.py", line 185, in retrying
    result = func()
  File "/home/odoo/src/odoo/19.0/odoo/http.py", line 2329, in _serve_ir_http
    response = self.dispatcher.dispatch(rule.endpoint, args)
  File "/home/odoo/src/odoo/19.0/odoo/http.py", line 2544, in dispatch
    result = self.request.registry['ir.http']._dispatch(endpoint)
  File "/home/odoo/src/odoo/19.0/addons/web/controllers/dataset.py", line 32, in call_kw
    return call_kw(request.env[model], method, args, kwargs)
  File "/home/odoo/src/odoo/19.0/odoo/service/model.py", line 93, in call_kw
    result = method(recs, *args, **kwargs)
  File ".../account_accountant/models/account_bank_statement.py", line 1532, in edit_reconcile_line
    self._set_move_line_to_statement_line_move(
  File ".../account_accountant/models/account_bank_statement.py", line 802, in _set_move_line_to_statement_line_move
    lines_to_add_balance = sum(line['balance'] for line in lines_to_add)
TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'`)}

<h3>Let's Read It Together</h3>

<h4>Step 1: Read the LAST line (the error)</h4>
${CB('text', `TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'`)}
${AN('<strong>TypeError</strong> = wrong type of data.<br><strong>"unsupported operand type(s) for +: \'int\' and \'NoneType\'"</strong> = Python tried to ADD a number (<code>int</code>) and an empty value (<code>NoneType</code>). You can\'t add a number and "nothing" together.')}

${CO('info', 'What is NoneType?', '<code>NoneType</code> means the value is <code>None</code> — it\'s empty/missing. The code expected a number but got nothing instead. It\'s like trying to add 5 + [empty cell] in a spreadsheet.')}

<h4>Step 2: Find WHERE it happened</h4>
${CB('text', `File ".../account_bank_statement.py", line 802, in _set_move_line_to_statement_line_move
    lines_to_add_balance = sum(line['balance'] for line in lines_to_add)`)}
${AN('<strong>File:</strong> <code>account_bank_statement.py</code> in the <code>account_accountant</code> module (Enterprise)<br><strong>Line:</strong> 802<br><strong>Method:</strong> <code>_set_move_line_to_statement_line_move</code><br><strong>Code:</strong> It\'s trying to SUM the \'balance\' from a list of lines. One of those balances is <code>None</code> instead of a number.')}

<h4>Step 3: Find WHAT triggered it</h4>
${CB('text', `File ".../account_bank_statement.py", line 1532, in edit_reconcile_line
    self._set_move_line_to_statement_line_move(`)}
${AN('The method <code>edit_reconcile_line</code> called <code>_set_move_line_to_statement_line_move</code>. This happens when you\'re reconciling a bank statement line.')}

<h4>Step 4: Skip the framework lines</h4>
<p>All the lines about <code>http.py</code>, <code>model.py</code>, <code>dataset.py</code> are just the framework calling the business code. We can ignore them.</p>

<h3>The Full Story</h3>
<p>Reading it all together:</p>
<ol>
<li>A user was <strong>editing a reconciliation</strong> on a bank statement</li>
<li>The code tried to <strong>sum up the balance</strong> of some journal lines</li>
<li>One of the lines had <code>None</code> for its balance (instead of a number like <code>0.0</code>)</li>
<li>Python can't add <code>None</code> to a number, so it crashed</li>
</ol>

${CO('support', 'What to tell the team', '"The error occurs during bank reconciliation in account_accountant. At line 802 of account_bank_statement.py, it tries to sum balances but one journal item has a None balance value instead of a number. This is likely a data issue — a journal item is missing its balance value, or a bug in the code that creates these items."')}

${QZ([
  { q: 'In this traceback, <code>TypeError: unsupported operand type(s) for +: \'int\' and \'NoneType\'</code> means:', opts: ['The server is overloaded', 'Code tried to add a number and an empty value (None) together', 'The user typed the wrong data', 'The database is full'], correct: 1, explain: 'Python can\'t add a number (int) and None (empty/missing value). Something that should have been a number was empty instead.' },
  { q: 'Which line tells you WHERE in the code the error happened?', opts: ['The first line of the traceback', 'The last File line before the error message — it shows the file and line number', 'The "Traceback" header line', 'The RPC_ERROR at the end'], correct: 1, explain: 'The last <code>File "..."</code> line before the error message shows the exact file, line number, and method where the crash occurred. In this case: account_bank_statement.py, line 802.' },
])}
` },

      { id: 'm6l3', title: 'Common Errors Explained', content: () => `
<h2>Common Errors Explained</h2>
<p>Here are the errors you'll see most often, with plain explanations of what each one means.</p>

<h3>1. AttributeError: 'bool' object has no attribute 'name'</h3>
${CB('text', `AttributeError: 'bool' object has no attribute 'name'`)}
<p><strong>Translation:</strong> Code tried to read <code>.name</code> from something that is <code>False</code> (a boolean, not a record).</p>
<p><strong>Why:</strong> An empty Many2one field (like no customer selected) is <code>False</code> in Odoo. Code did <code>record.partner_id.name</code> but <code>partner_id</code> was empty.</p>
<p><strong>The fix:</strong> The code needs to check first: <code>if record.partner_id:</code></p>

<h3>2. ValueError: Expected singleton</h3>
${CB('text', `ValueError: Expected singleton: sale.order(15, 23, 42)`)}
<p><strong>Translation:</strong> Code expected ONE record but got THREE (records with IDs 15, 23, 42).</p>
<p><strong>Why:</strong> The code did something like <code>self.partner_id.name</code> but <code>self</code> contained multiple records.</p>
<p><strong>The fix:</strong> Add a <code>for record in self:</code> loop.</p>

<h3>3. AccessError: Not allowed</h3>
${CB('text', `AccessError: You are not allowed to modify 'Sales Order' (sale.order) records.`)}
<p><strong>Translation:</strong> The user's security group doesn't have permission.</p>
<p><strong>Where to look:</strong> Check the user's groups in Settings → Users, and check <code>ir.model.access.csv</code> files.</p>

<h3>4. Invalid view definition</h3>
${CB('text', `ParseError: "Invalid view definition"
Element '<field name="custom_field">' cannot be located in parent view`)}
<p><strong>Translation:</strong> A view tries to show a field that doesn't exist on the model.</p>
<p><strong>Why:</strong> Usually a custom module adds a field to a view, but the field's module is not installed or was removed.</p>

<h3>5. TypeError: unsupported operand type(s)</h3>
${CB('text', `TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'`)}
<p><strong>Translation:</strong> Code tried to do math with a number and an empty value (None).</p>
<p><strong>Why:</strong> A field that should have a number has <code>None</code> instead. Usually a data issue or a field that wasn't set.</p>

<h3>6. UserError / ValidationError</h3>
${CB('text', `UserError: It is not allowed to confirm a sales order that has no line.`)}
<p><strong>Translation:</strong> This is an <strong>intentional</strong> check. A developer wrote this on purpose to prevent something.</p>
<p><strong>Where to look:</strong> Search the error message text in the code. You'll find the <code>raise UserError(...)</code> or <code>raise ValidationError(...)</code>.</p>

<h3>Quick Reference Table</h3>
${CT([
  ['Error you see', 'What it means in plain English'],
  ['<code>AttributeError: \'bool\' has no attribute...</code>', 'A field is empty (False) and code tried to read from it'],
  ['<code>Expected singleton</code>', 'Code expected 1 record but got multiple — needs a loop'],
  ['<code>AccessError</code>', 'User doesn\'t have permission — check their security groups'],
  ['<code>Invalid view definition</code>', 'A view references a field that doesn\'t exist'],
  ['<code>TypeError: ... \'NoneType\'</code>', 'A value is missing/empty where a number or text was expected'],
  ['<code>UserError</code>', 'An intentional business rule check — the code is saying "no" on purpose'],
  ['<code>ValidationError</code>', 'Data failed a validation check on save'],
  ['<code>RecursionError</code>', 'Code is calling itself in an infinite loop'],
])}

${QZ([
  { q: '"AttributeError: \'bool\' object has no attribute \'street\'" — what probably happened?', opts: ['The street field doesn\'t exist', 'A relational field (like partner_id) is empty, and code tried to access .street on it', 'The database is broken', 'The view is wrong'], correct: 1, explain: 'Empty Many2one fields are <code>False</code> in Odoo. <code>record.partner_id.street</code> becomes <code>False.street</code> when no partner is set, causing this error.' },
  { q: 'You see <code>UserError: "Cannot delete a posted invoice"</code>. Is this a bug?', opts: ['Yes, it\'s a code bug', 'No — this is an intentional check. The code was designed to prevent this action.', 'It depends on the version', 'Always a database issue'], correct: 1, explain: '<code>UserError</code> means a developer wrote a check on purpose. The code found a condition that shouldn\'t happen and raised an error. It\'s working as designed — the user needs to take a different approach.' },
])}
` },
    ]
  },

  {
    id: 'm7', icon: '\u{1F3C6}',
    title: 'Putting It All Together',
    desc: 'Practice reading real Odoo code — models, views, and tracing issues.',
    lessons: [
      { id: 'm7l1', title: 'Reading a Real View', content: () => `
<h2>Reading a Real View</h2>
<p>Let's practice reading a real piece of the invoice form view. This is similar to what you see in Developer Mode → Edit View.</p>

<h3>The Header Section</h3>
${CB('xml', `<header>
    <button name="action_post" string="Confirm"
            class="oe_highlight" type="object"
            groups="account.group_account_invoice"
            invisible="hide_post_button or move_type == 'entry'"/>

    <button name="action_register_payment" string="Pay"
            class="oe_highlight" type="object"
            groups="account.group_account_invoice"
            invisible="state != 'posted'
                       or payment_state not in ('not_paid', 'partial')
                       or move_type not in ('out_invoice', 'in_invoice')"/>
</header>`)}

${AN('<strong>Button 1 - "Confirm":</strong><br>- Calls <code>action_post</code> method<br>- Only visible to the "Invoicing" group<br>- HIDDEN when: <code>hide_post_button</code> is true OR the type is a journal entry<br><br><strong>Button 2 - "Pay":</strong><br>- Calls <code>action_register_payment</code> method<br>- HIDDEN when: state is not \'posted\' OR payment is already done OR it\'s not an invoice<br>- In other words: only shows on posted, unpaid invoices')}

${CO('support', 'Reading invisible conditions', 'When a user asks "why can\'t I see the Pay button?", check the <code>invisible</code> condition:<br>1. Is the invoice posted? (<code>state != \'posted\'</code>)<br>2. Is it already paid? (<code>payment_state not in (\'not_paid\', \'partial\')</code>)<br>3. Is it an invoice type? (<code>move_type not in (\'out_invoice\', \'in_invoice\')</code>)<br><br>If ANY of these conditions is true, the button is hidden.')}

<h3>Reading "invisible" Step by Step</h3>
<p>The <code>invisible</code> attribute uses simple logic words:</p>

${CT([
  ['Word', 'Meaning', 'Example'],
  ['<code>or</code>', 'If ANY condition is true, hide it', '<code>state == \'draft\' or state == \'cancel\'</code>'],
  ['<code>and</code>', 'If ALL conditions are true, hide it', '<code>state == \'posted\' and amount == 0</code>'],
  ['<code>not in</code>', 'Value is NOT in this list', '<code>move_type not in (\'out_invoice\',)</code>'],
  ['<code>!=</code>', 'Not equal to', '<code>state != \'draft\'</code>'],
  ['<code>==</code>', 'Equal to', '<code>state == \'posted\'</code>'],
])}

${QZ([
  { q: 'A button has <code>invisible="state != \'posted\' or payment_state == \'paid\'"</code>. When do you see it?', opts: ['Always', 'Only when state IS posted AND payment_state is NOT paid', 'Only in draft', 'Never'], correct: 1, explain: 'The button is HIDDEN when state is not posted OR when it\'s already paid. So it\'s VISIBLE only when state IS posted AND it\'s NOT paid.' },
])}
` },

      { id: 'm7l2', title: 'Module Structure: Where to Find Things', content: () => `
<h2>Module Structure: Where to Find Things</h2>
<p>Knowing where files live helps you find the code behind any feature.</p>

<h3>Every Module Is a Folder</h3>
${CB('text', `sale/                              # Module folder
├── __manifest__.py                # Module info (name, dependencies)
├── __init__.py                    # Lists Python files to load
├── models/                        # Python code (data definitions)
│   ├── __init__.py
│   └── sale_order.py              # The SaleOrder model
├── views/                         # XML views (what you see on screen)
│   └── sale_order_views.xml       # Forms, lists, menus
├── security/                      # Who can access what
│   └── ir.model.access.csv        # Read/Write/Create/Delete permissions
└── data/                          # Default data`)}

<h3>Finding What You Need</h3>
${CT([
  ['I want to find...', 'Look in...'],
  ['How a field is defined', '<code>models/*.py</code> — search for <code>field_name = fields.</code>'],
  ['How a form looks', '<code>views/*_views.xml</code> — look inside <code>&lt;form&gt;</code> tags'],
  ['Menu and action setup', '<code>views/*_views.xml</code> — look for <code>&lt;menuitem&gt;</code> and <code>ir.actions.act_window</code>'],
  ['Who can access what', '<code>security/ir.model.access.csv</code>'],
  ['What the module depends on', '<code>__manifest__.py</code> → <code>depends</code> list'],
  ['A compute method', '<code>models/*.py</code> — search for <code>def _compute_</code>'],
])}

${CO('tip', 'Quick Finding Trick', 'When you know the model name (like <code>sale.order</code>), convert dots to underscores to get the filename: <code>sale_order.py</code>. The module is the first part: <code>sale</code>.')}

${QZ([
  { q: 'You need to check who can create sales orders. Where do you look?', opts: ['models/sale_order.py', 'views/sale_order_views.xml', 'security/ir.model.access.csv', '__manifest__.py'], correct: 2, explain: '<code>ir.model.access.csv</code> defines CRUD (Create, Read, Update, Delete) permissions per security group. Each line says which group can do what with which model.' },
])}
` },

      { id: 'm7l3', title: 'Complete Investigation Workflow', content: () => `
<h2>Complete Investigation Workflow</h2>
<p>Let's bring everything together into a workflow you can use for any support case.</p>

<h3>Scenario: "The total on my sales order is wrong"</h3>

<h4>Step 1: Identify the field</h4>
<p>Enable Developer Mode → Hover over the total field → Note:</p>
<ul>
<li>Technical name: <code>amount_total</code></li>
<li>Model: <code>sale.order</code></li>
<li>Type: Monetary (computed)</li>
</ul>

<h4>Step 2: Find the field in code</h4>
${CB('python', `# In sale/models/sale_order.py:
amount_total = fields.Monetary(
    string="Total",
    compute='_compute_amounts',
    store=True,
)`)}
${AN('The field is computed by <code>_compute_amounts</code> method. <code>store=True</code> means the value is saved in the database.')}

<h4>Step 3: Find the compute method</h4>
${CB('python', `@api.depends('order_line.price_subtotal', 'order_line.price_tax')
def _compute_amounts(self):
    for order in self:
        lines = order.order_line.filtered(lambda x: not x.display_type)
        order.amount_untaxed = sum(lines.mapped('price_subtotal'))
        order.amount_tax = sum(lines.mapped('price_tax'))
        order.amount_total = order.amount_untaxed + order.amount_tax`)}

${AN('<strong>@api.depends</strong> tells us: this recalculates when order line subtotals or taxes change.<br><br><strong>Line 4:</strong> Get the order lines, but skip "display type" lines (section headers and notes).<br><br><strong>Line 5:</strong> Sum up all the subtotals.<br><br><strong>Line 6:</strong> Sum up all the taxes.<br><br><strong>Line 7:</strong> Total = untaxed amount + taxes.')}

<h4>Step 4: Check the chain</h4>
<p>If the total is wrong, check:</p>
<ol>
<li>Are the individual line subtotals correct?</li>
<li>Are the tax amounts correct?</li>
<li>Is a custom module overriding <code>_compute_amounts</code>?</li>
<li>Did the depends trigger fire? (Sometimes stored computed fields need a manual recompute)</li>
</ol>

<h3>Your Investigation Template</h3>
${CB('text', `ISSUE: [What the user reports]
STEPS TO REPRODUCE: 1... 2... 3...
AFFECTS: [Everyone? One user? One record?]

INVESTIGATION:
- Field: [technical name from Developer Mode]
- Model: [model name from Developer Mode]
- Is it computed? [yes/no, compute method name]
- What does it depend on? [@api.depends fields]
- Are the source values correct?
- Is a custom module involved?

ROOT CAUSE: [What's actually wrong]
RESOLUTION: [What needs to happen]`)}

${CO('tip', 'Remember', 'You now have the skills to:<br>- Read Python code (variables, if/else, loops, classes)<br>- Understand models and fields<br>- Read XML views (forms, buttons, invisible conditions)<br>- Read tracebacks (bottom-up!)<br>- Use Developer Mode to trace anything on screen<br><br>Practice every day — each support case is a chance to strengthen these skills!')}

${QZ([
  { q: 'A computed field shows a wrong value. What\'s the first thing to check?', opts: ['The database server', 'The @api.depends list and the compute method logic', 'The user\'s browser', 'The XML view'], correct: 1, explain: 'Find the <code>compute=</code> method and check what <code>@api.depends</code> lists. Then read the method to understand the calculation. Check if the source values (the depends fields) are correct.' },
  { q: 'A user says "I can see the Sales menu but the list is empty." What\'s most likely?', opts: ['The database is empty', 'Record rules are filtering out all records for this user', 'The list view XML is broken', 'The browser is blocking content'], correct: 1, explain: 'If the menu is visible but the list is empty, the user has access to the model (can see the menu) but record rules are hiding all records. Check their security group and company assignment.' },
])}
` },
    ]
  },
];

// ============================================================
// HELPERS
// ============================================================
function CB(lang, code) {
  const lines = code.split('\n');
  const hl = lines.map((line, i) => {
    const num = i + 1;
    const h = HS(line, lang);
    return '<span class="line"><span class="line-num">' + num + '</span>' + h + '</span>';
  }).join('');
  return '<div class="code-block"><div class="code-header"><span class="lang">' + lang + '</span></div><div class="code-content">' + hl + '</div></div>';
}
function HS(line, lang) {
  const e = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (lang === 'python') return e.replace(/(#.*$)/gm,'<span class="cm">$1</span>').replace(/\b(from|import|class|def|return|if|elif|else|for|in|while|not|and|or|is|True|False|None|raise|try|except|finally|with|as|lambda|yield|pass|break|continue|self|super)\b/g,'<span class="kw">$1</span>').replace(/(f?"""[\s\S]*?"""|f?\'\'\'[\s\S]*?\'\'\'|f?"[^"]*"|f?\'[^\']*\')/g,'<span class="str">$1</span>').replace(/@[\w.]+/g,'<span class="dec">$&</span>').replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  if (lang === 'xml') return e.replace(/(&lt;!--.*?--&gt;)/g,'<span class="xml-cm">$1</span>').replace(/(&lt;\/?)([\w:.]+)/g,'$1<span class="tag">$2</span>').replace(/([\w:-]+)(=)("[^"]*")/g,'<span class="attr">$1</span>$2<span class="val">$3</span>');
  return e;
}
function CT(rows) { const h=rows[0],b=rows.slice(1); return '<table class="compare-table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; }
function CO(type, title, body) { return '<div class="callout callout-'+type+'"><div class="callout-title">'+title+'</div><div>'+body+'</div></div>'; }
function AN(text) { return '<div class="code-annotation">'+text+'</div>'; }
function TG(title, content) { const id='tg_'+Math.random().toString(36).substr(2,9); return '<div class="toggle-block"><div class="toggle-header" onclick="toggleBlock(\''+id+'\')"><span class="arrow">&#9654;</span> '+title+'</div><div class="toggle-content" id="'+id+'">'+content+'</div></div>'; }
function QZ(questions) { const qid='qz_'+Math.random().toString(36).substr(2,9); return '<div class="quiz-section"><h3>Check Your Understanding</h3>'+questions.map((q,i)=>'<div class="quiz-question" id="'+qid+'_q'+i+'"><p>'+(i+1)+'. '+q.q+'</p><ul class="quiz-options">'+q.opts.map((o,j)=>'<li onclick="selectAnswer(\''+qid+'\','+i+','+j+','+q.correct+')" data-q="'+qid+'" data-qi="'+i+'" data-oi="'+j+'">'+o+'</li>').join('')+'</ul><div class="quiz-explanation" id="'+qid+'_e'+i+'">'+q.explain+'</div></div>').join('')+'</div>'; }

// ============================================================
// STATE
// ============================================================
const STATE_KEY = 'odoo_academy_progress';
function loadState() { try { const r=localStorage.getItem(STATE_KEY); return r?JSON.parse(r):{completed:{},lastLesson:null}; } catch { return {completed:{},lastLesson:null}; } }
function saveState(s) { try { localStorage.setItem(STATE_KEY,JSON.stringify(s)); } catch {} }
let state = loadState();
function getCompletionPercent() { const t=MODULES.reduce((s,m)=>s+m.lessons.length,0); return Math.round((Object.keys(state.completed).length/t)*100); }
function getModuleCompletion(mod) { const d=mod.lessons.filter(l=>state.completed[l.id]).length; return {done:d,total:mod.lessons.length}; }

// ============================================================
// RENDERING
// ============================================================
function renderSidebar() {
  const list=document.getElementById('moduleList');
  list.innerHTML=MODULES.map(mod=>{const{done,total}=getModuleCompletion(mod);const isExp=mod.lessons.some(l=>l.id===state.lastLesson);return '<div class="module-group"><div class="module-header '+(isExp?'expanded':'')+'" onclick="toggleModule(this)"><span class="arrow">&#9654;</span><span class="mod-icon">'+mod.icon+'</span><span>'+mod.title+'</span><span class="mod-progress">'+done+'/'+total+'</span></div><div class="lesson-list '+(isExp?'open':'')+'">'+mod.lessons.map(l=>'<div class="lesson-item '+(state.completed[l.id]?'completed':'')+' '+(state.lastLesson===l.id?'active':'')+'" onclick="openLesson(\''+mod.id+'\',\''+l.id+'\')"><span class="check">'+(state.completed[l.id]?'&#10003;':'')+'</span><span>'+l.title+'</span></div>').join('')+'</div></div>';}).join('');
}
function renderHome() {
  const pct=getCompletionPercent();
  document.getElementById('globalProgress').style.width=pct+'%';
  document.getElementById('globalProgressText').textContent=pct+'% complete';
  if(state.lastLesson){document.getElementById('continueBtn').style.display='inline-flex';document.getElementById('startBtn').textContent='Start from Beginning';}
  document.getElementById('roadmapGrid').innerHTML=MODULES.map(mod=>{const{done,total}=getModuleCompletion(mod);const p=Math.round((done/total)*100);return '<div class="roadmap-card" onclick="openFirstLesson(\''+mod.id+'\')"><div class="mod-num">Module '+(MODULES.indexOf(mod)+1)+'</div><h4>'+mod.icon+' '+mod.title+'</h4><p>'+mod.desc+'</p><div class="card-progress"><div class="card-progress-fill" style="width:'+p+'%"></div></div></div>';}).join('');
}
function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(n+'View').classList.add('active');}
function renderLesson(modId,lessonId){
  const mod=MODULES.find(m=>m.id===modId),lesson=mod.lessons.find(l=>l.id===lessonId);
  const li=mod.lessons.indexOf(lesson),mi=MODULES.indexOf(mod);
  document.getElementById('lessonBreadcrumb').textContent='Module '+(mi+1)+': '+mod.title+' → Lesson '+(li+1);
  const body=document.getElementById('lessonBody');
  body.innerHTML=lesson.content();
  const ic=!!state.completed[lessonId];
  body.innerHTML+='<div class="complete-section"><button class="btn btn-complete '+(ic?'done':'')+'" onclick="completeLesson(\''+lessonId+'\')" '+(ic?'disabled':'')+'>'+( ic?'&#10003; Completed':'Mark as Complete')+'</button></div>';
  const{prev,next}=getAdjacentLessons(modId,lessonId);
  const pb=document.getElementById('prevLessonBtn'),nb=document.getElementById('nextLessonBtn');
  if(prev){pb.style.display='inline-flex';pb.onclick=()=>openLesson(prev.modId,prev.lessonId);pb.textContent='← '+prev.title;}else pb.style.display='none';
  if(next){nb.style.display='inline-flex';nb.onclick=()=>openLesson(next.modId,next.lessonId);nb.textContent=next.title+' →';}else nb.style.display='none';
  state.lastLesson=lessonId;saveState(state);renderSidebar();showView('lesson');window.scrollTo(0,0);
}
function getAdjacentLessons(modId,lessonId){const f=[];MODULES.forEach(m=>m.lessons.forEach(l=>f.push({modId:m.id,lessonId:l.id,title:l.title})));const i=f.findIndex(x=>x.lessonId===lessonId);return{prev:i>0?f[i-1]:null,next:i<f.length-1?f[i+1]:null};}

// ============================================================
// EVENTS
// ============================================================
function toggleModule(h){h.classList.toggle('expanded');h.nextElementSibling.classList.toggle('open');}
function openLesson(m,l){renderLesson(m,l);document.getElementById('sidebar').classList.remove('open');}
function openFirstLesson(m){const mod=MODULES.find(x=>x.id===m);if(mod&&mod.lessons.length)openLesson(m,mod.lessons[0].id);}
function completeLesson(lid){state.completed[lid]=true;saveState(state);renderSidebar();renderHome();const b=document.querySelector('.btn-complete');if(b){b.classList.add('done');b.disabled=true;b.innerHTML='&#10003; Completed';}const p=getCompletionPercent();document.getElementById('globalProgress').style.width=p+'%';document.getElementById('globalProgressText').textContent=p+'% complete';}
window.selectAnswer=function(qid,qi,oi,correct){document.querySelectorAll('[data-q="'+qid+'"][data-qi="'+qi+'"]').forEach((li,j)=>{li.classList.add('disabled');if(j===correct)li.classList.add('correct');if(j===oi&&j!==correct)li.classList.add('wrong');});const e=document.getElementById(qid+'_e'+qi);if(e)e.classList.add('visible');};
window.toggleBlock=function(id){const el=document.getElementById(id);el.classList.toggle('open');el.previousElementSibling.classList.toggle('open');};
document.getElementById('startBtn').addEventListener('click',()=>openFirstLesson('m1'));
document.getElementById('continueBtn').addEventListener('click',()=>{if(state.lastLesson){const m=MODULES.find(x=>x.lessons.some(l=>l.id===state.lastLesson));if(m)openLesson(m.id,state.lastLesson);}});
document.getElementById('backBtn').addEventListener('click',()=>{showView('home');renderHome();});
document.getElementById('sidebarToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
renderSidebar();renderHome();
</script>
</body>
</html>
